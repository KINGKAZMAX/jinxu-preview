<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="锦序 · 云锦造物规则的转译、生成与交接。蔡智鑫，智艺未来学术汇报。">
  <title>锦序 · 云锦造物规则的转译、生成与交接</title>
  <link rel="stylesheet" href="./assets/brocade-report/report.css">
  <script src="./assets/brocade-report/report.js" defer></script>
</head>
<body>
  <div class="report-home" id="report-home">
    <header class="site-head">
      <a class="site-title" href="./#/" aria-label="回到锦序展厅">锦序 <span lang="en">JinXu</span></a>
      <nav aria-label="锦序导航">
        <a href="./#/">云锦展厅</a>
        <a href="./#/colors/722231">色与纹</a>
        <a href="./#/lab?tab=weave">织造</a>
      </nav>
    </header>

    <main class="report-main">
      <div class="report-cover">
        <img src="./assets/brocade-report/slide-01.webp" width="1920" height="1080"
          fetchpriority="high" alt="智艺未来学术汇报封面，锦序 · 云锦造物规则的转译、生成与交接">
      </div>
      <div class="report-intro">
        <p class="report-venue">智艺未来 · 学术汇报</p>
        <h1>云锦造物规则的<br>转译、生成与交接</h1>
        <p class="report-summary">锦序把南京云锦的铺排和配色规则写成可编辑的设计参数。以半落为例，奇数列错开半格，再检查云纹接缝能否对齐。</p>
        <p class="report-summary">项目整理了 12 条候选规则，用 6 项简化检测比较 180 张生成图。纹样参数、配色与出处存入设计包，供下一位设计者接续编辑。</p>
        <p class="report-credit">蔡智鑫 · 浙江科技大学</p>
        <button class="start-button" type="button" id="report-start" disabled>
          开始放映
        </button>
        <noscript><p class="report-summary">请启用 JavaScript 后放映汇报。</p></noscript>
      </div>
    </main>
  </div>

  <section id="report-player" class="report-player" role="dialog" aria-modal="true"
    aria-label="锦序汇报放映" tabindex="-1" hidden>
    <div class="slide-view" id="slide-view">
      <figure id="slide-image" aria-label="当前幻灯片"></figure>
      <div class="slide-message" id="slide-message" role="status" hidden>
        <p id="slide-message-text"></p>
        <button id="slide-retry" type="button" hidden>重新加载</button>
      </div>
    </div>
    <div class="player-bar player-top">
      <button id="report-exit" type="button">退出放映</button>
      <button id="report-fullscreen" type="button" hidden>全屏</button>
    </div>
    <div class="player-bar player-bottom">
      <button id="slide-prev" type="button" aria-label="上一页">上一页</button>
      <div class="player-position">
        <label class="sr-only" for="slide-select">跳转到幻灯片</label>
        <select id="slide-select"></select>
        <a id="slide-link" hidden></a>
      </div>
      <button id="slide-next" type="button" aria-label="下一页">下一页</button>
    </div>
    <p class="sr-only" id="slide-status" aria-live="polite" aria-atomic="true"></p>
  </section>
</body>
</html>
